<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusShare - Register</title>
<link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/site.css">
<style>
    .reg-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    @media (max-width: 768px) {
        .reg-grid {
            grid-template-columns: 1fr;
        }
    }
    #registerForm .form-group input,
    #registerForm .form-group select {
        width: 100%;
        height: 52px;
        box-sizing: border-box;
        padding: 0 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        font-size: 14px;
        outline: none;
    }
    #registerForm .form-group input:focus,
    #registerForm .form-group select:focus {
        border-color: #6366f1;
    }
    .msg-banner {
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 14px;
        display: none;
    }
    .msg-banner.error {
        display: block;
        background: #fee2e2;
        color: #b91c1c;
        border: 1px solid #f87171;
    }
    .msg-banner.success {
        display: block;
        background: #dcfce7;
        color: #15803d;
        border: 1px solid #86efac;
    }
</style>
<script src="../js/registration.js" defer></script>
</head>
<body>
<div class="login-page">
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="brand">
            <div class="cap-icon">🎓</div>
            <h1>Campus<span>Share</span></h1>
            <p>College Resource Sharing Platform</p>
        </div>
        <div class="student-image">
            <img src="../images/students.png" alt="College Students">
        </div>
        <div class="quote">
            <div class="quote-mark">“</div>
            <p>Join Your Campus Community,<br>Share Essentials,<br>Save Together.</p>
            <div class="quote-end">”</div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="login-box" style="max-width: 500px;">
            <div class="login-heading">
                <h2>Create Account</h2>
                <p>Join CampusShare peer-to-peer network</p>
                <div class="heading-line"></div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <!-- REGISTRATION FORM -->
            <form id="registerForm">
                <div class="reg-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="form-group">
                        <label for="rollNumber">Roll / Student Number:</label>
                        <input type="text" id="rollNumber" placeholder="e.g. 22CSE123" required>
                    </div>
                </div>

                <div class="reg-grid">
                    <div class="form-group">
                        <label for="email">Campus Email:</label>
                        <input type="email" id="email" placeholder="e.g. rahul@gmail.com" title="Use a valid @gmail.com address." required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number:</label>
                        <input type="tel" id="mobile" placeholder="e.g. 9876543210" required>
                    </div>
                </div>

                <div class="reg-grid">
                    <div class="form-group">
                        <label for="department">Department:</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science (CSE)</option>
                            <option value="ECE">Electronics (ECE)</option>
                            <option value="MECH">Mechanical (MECH)</option>
                            <option value="CIVIL">Civil Engineering</option>
                            <option value="IT">Information Tech (IT)</option>
                            <option value="EEE">Electrical (EEE)</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Year of Study:</label>
                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year (Junior)</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year (Senior)</option>
                            <option value="4th Year">4th Year (Senior)</option>
                            <option value="Postgraduate">Postgraduate</option>
                        </select>
                    </div>
                </div>

                <div class="reg-grid">
                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Password (min 8 chars):</label>
                        <input type="password" id="password" placeholder="Create password" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="login-button" id="registerButton" style="margin-top: 10px;">
                    Register Account
                </button>

                <div class="or">
                    <span></span>
                    <p>already have an account?</p>
                    <span></span>
                </div>

                <a href="login.html" class="create-account">
                    Back to Login
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
