<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusShare - Browse Resources</title>

    <link
        rel="stylesheet"
        href="../css/browse-resources.css"
    >
    <link rel="stylesheet" href="../css/site.css">

    <script
        src="../js/browse.js"
        defer
    ></script>

</head>

<body>

    <header class="top-bar">

        <div class="logo">
            Campus<span>Share</span>
        </div>

        <nav>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="browse.html"
               class="active">
                Browse Resources
            </a>

            <a href="my_requests.html">
                My Requests
            </a>

        </nav>

        <button
            type="button"
            id="logoutButton"
        >
            Logout
        </button>

    </header>


    <main class="resources-page">

        <section class="page-heading">

            <h1>
                Browse Resources
            </h1>

            <p>
                Find and request resources available on campus.
            </p>

        </section>


        <section class="search-section">

            <input
                type="search"
                id="searchInput"
                placeholder="Search resources..."
            >

            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

            </select>

        </section>


        <section
            id="loadingMessage"
            class="loading-message"
        >
            Loading resources...
        </section>


        <section
            id="resourceContainer"
            class="resource-container"
        >
        </section>


        <section
            id="emptyMessage"
            class="empty-message"
            style="display: none;"
        >

            <h2>
                No resources found
            </h2>

            <p>
                Try changing your search or category.
            </p>

        </section>

    </main>

</body>

</html>
