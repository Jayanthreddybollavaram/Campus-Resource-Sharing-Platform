<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>CampusShare - My Requests</title>
    <link
        rel="stylesheet"
        href="../css/my_requests.css"
    >
    <link rel="stylesheet" href="../css/site.css">
    <script
        src="../js/my_requests.js"
        defer
    ></script>
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            Campus<span>Share</span>
        </div>

        <nav>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="browse.html">
                Browse Resources
            </a>

            <a
                href="my_requests.html"
                class="active"
            >
                My Requests
            </a>

        </nav>

        <button
            type="button"
            id="logoutButton"
        >
            Logout
        </button>

    </header>


    <main class="requests-page">

        <section class="page-heading">

            <h1>
                My Requests
            </h1>

            <p>
                View the resources you have requested.
            </p>

        </section>


        <section class="filter-section">

            <select id="statusFilter">

                <option value="">
                    All Requests
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Approved">
                    Approved
                </option>

                <option value="Rejected">
                    Rejected
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

        </section>


        <div
            id="loadingMessage"
            class="loading-message"
        >
            Loading your requests...
        </div>


        <section
            id="requestsContainer"
            class="requests-container"
        >
        </section>


        <section
            id="emptyMessage"
            class="empty-message"
            style="display: none;"
        >

            <h2>
                No requests found
            </h2>

            <p>
                You have not made any resource requests yet.
            </p>

            <a href="browse.html">
                Browse Resources
            </a>

        </section>

    </main>

</body>

</html>
